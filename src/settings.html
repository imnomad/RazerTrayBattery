<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Razer Battery – Settings</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background: #0d1117;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
      user-select: none;
      overflow: hidden;
      border: 1px solid #30363d;
      border-radius: 10px;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Custom Draggable Titlebar */
    .titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 38px;
      background: #161b22;
      border-bottom: 1px solid #21262d;
      padding: 0 10px 0 14px;
      -webkit-app-region: drag;
      flex-shrink: 0;
    }

    .titlebar-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .titlebar-title {
      font-size: 12.5px;
      font-weight: 600;
      color: #e6edf3;
      letter-spacing: 0.2px;
    }

    .titlebar-close {
      -webkit-app-region: no-drag;
      background: transparent;
      border: none;
      color: #8b949e;
      cursor: pointer;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: all 0.12s ease;
      padding: 0;
    }

    .titlebar-close:hover {
      background: #da3633;
      color: #ffffff;
    }

    /* Scrollable / Fit Content Body */
    .content-body {
      padding: 14px 18px 18px 18px;
      overflow-x: hidden;
      overflow-y: auto;
      flex: 1;
    }

    .checkbox-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 12.5px;
      cursor: pointer;
      color: #cbd5e1;
      font-weight: 500;
    }

    .checkbox-label input {
      accent-color: #22c55e;
      width: 15px;
      height: 15px;
      cursor: pointer;
    }

    /* Style Group */
    .style-group {
      margin-bottom: 14px;
      background: #161b22;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #30363d;
    }

    .style-group-title {
      font-size: 10.5px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .style-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .style-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0f131a;
      border: 1px solid #282f3c;
      border-radius: 7px;
      padding: 3px 8px 3px 10px;
      cursor: pointer;
      transition: all 0.12s ease-in-out;
    }

    .style-card:hover {
      background: #1c222e;
      border-color: #3b4458;
    }

    .style-card:has(input:checked) {
      background: #142033;
      border-color: #3b82f6;
    }

    .style-left {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .style-left input[type="radio"] {
      margin: 0;
      cursor: pointer;
      accent-color: #3b82f6;
      width: 14px;
      height: 14px;
    }

    .style-name {
      font-size: 12.5px;
      font-weight: 600;
      color: #f0f6fc;
    }

    .style-mockup img {
      display: block;
      border-radius: 5px;
      height: 28px;
    }

    /* Devices Section */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .section-title {
      font-size: 10.5px;
      font-weight: 700;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    button.refresh-btn {
      background: #238636;
      border: 1px solid rgba(240, 246, 252, 0.1);
      color: #fff;
      padding: 4px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 11.5px;
      font-weight: 600;
      transition: background 0.12s;
    }

    button.refresh-btn:hover {
      background: #2ea043;
    }

    #devices {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 8px 12px;
    }

    .left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .type-badge {
      background: #21262d;
      color: #58a6ff;
      font-weight: 800;
      font-size: 10.5px;
      padding: 3px 7px;
      border-radius: 5px;
      border: 1px solid #30363d;
      letter-spacing: 0.5px;
    }

    .name {
      font-size: 13.5px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 240px;
      color: #f0f6fc;
    }

    .meta {
      font-size: 11px;
      color: #8b949e;
      margin-top: 1px;
    }

    .badge {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      background: #21262d;
      color: #fff;
      white-space: nowrap;
    }

    .badge.ok {
      background: #238636;
    }

    .badge.disconnected {
      background: #da3633;
    }
  </style>
</head>

    <div class="section-header">
      <div class="section-title">Connected Devices</div>
      <button class="refresh-btn" id="refresh-btn">Refresh</button>
    </div>

    <div id="devices"></div>
  </div>

  <script>
    const devicesEl = document.getElementById('devices');
    const refreshBtn = document.getElementById('refresh-btn');
    const autostartCheckbox = document.getElementById('autostart');
    const closeBtn = document.getElementById('close-btn');

    closeBtn.addEventListener('click', () => {
      window.api.invoke('window:close');
    });

    async function loadAutostart() {
      const enabled = await window.api.invoke('settings:getAutoStart');
      autostartCheckbox.checked = enabled;
    }
    autostartCheckbox.addEventListener('change', async () => {
      await window.api.invoke('settings:setAutoStart', autostartCheckbox.checked);
    });

    async function loadStyle() {
      const style = await window.api.invoke('settings:getStyle');
      const radio = document.querySelector('input[name="ui-style"][value="' + style + '"]');
      if (radio) {
        radio.checked = true;
      }
    }

    document.querySelectorAll('input[name="ui-style"]').forEach(r => {
      r.addEventListener('change', async () => {
        if (r.checked) {
          await window.api.invoke('settings:setStyle', r.value);
        }
      });
    });

    async function loadDevices() {
      const { devices } = await window.api.invoke('devices:list');
      devicesEl.innerHTML = '';

      for (const device of devices) {
        const wrap = document.createElement('div');
        wrap.className = 'item';

        const left = document.createElement('div');
        left.className = 'left';

        const typeBadge = document.createElement('span');
        typeBadge.className = 'type-badge';
        typeBadge.textContent = (device.deviceType || 'DEVICE').toUpperCase();
        left.appendChild(typeBadge);

        const textWrap = document.createElement('div');

        const nameEl = document.createElement('div');
        nameEl.className = 'name';
        nameEl.textContent = device.productName || 'Razer Device';

        const metaEl = document.createElement('div');
        metaEl.className = 'meta';
        metaEl.textContent =
          'VID 0x' + device.vendorId.toString(16).padStart(4, '0') + ' · ' +
          'PID 0x' + device.productId.toString(16).padStart(4, '0');

        textWrap.appendChild(nameEl);
        textWrap.appendChild(metaEl);

        left.appendChild(textWrap);

        const badge = document.createElement('div');
        badge.className = 'badge';
        badge.textContent = '…';

        wrap.appendChild(left);
        wrap.appendChild(badge);
        devicesEl.appendChild(wrap);

        const status = await window.api.invoke('devices:batteryStatus', device.key);
        badge.className = 'badge ' + status.status;

        if (status.status === 'ok') {
          badge.textContent = status.charging ? status.percent + '% (Charging)' : status.percent + '%';
        } else {
          badge.textContent = status.status;
        }
      }
    }

    refreshBtn.addEventListener('click', async () => {
      await window.api.invoke('devices:refresh');
      loadDevices();
    });

    loadDevices();
    loadAutostart();
    loadStyle();
  </script>
